{% extends 'planner/base.html' %}

{% block title %}Create Event{% endblock %}

{% block content %}
<h2>Create Event</h2>

<div class="form-wrapper">
  <form method="post" class="event-form">
    {% csrf_token %}

    <div class="form-row">
      <label for="{{ form.title.id_for_label }}">Title:</label>
      <div class="form-input">{{ form.title }}</div>
    </div>

    <div class="form-row">
      <label for="{{ form.description.id_for_label }}">Description:</label>
      <div class="form-input">{{ form.description }}</div>
    </div>

    <div class="form-row">
      <label for="{{ form.location.id_for_label }}">Location:</label>
      <div class="form-input">{{ form.location }}</div>
    </div>

    <div class="form-row">
      <label for="{{ form.date.id_for_label }}">Date:</label>
      <div class="form-input">{{ form.date }}</div>
    </div>

    <div class="form-row">
      <label for="{{ form.time.id_for_label }}">Time:</label>
      <div class="form-input">{{ form.time }}</div>
    </div>

    <div class="form-row button-row">
      <button type="submit">Save</button>
    </div>
  </form>
</div>
{% endblock %}
